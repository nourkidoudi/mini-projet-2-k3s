# Modèle : ne contient AUCUN secret réel.
# Générer le vrai secret avec :
#   kubectl create secret generic db-credentials -n tasks \
#     --from-literal=POSTGRES_USER=<utilisateur> \
#     --from-literal=POSTGRES_PASSWORD=<mot-de-passe> \
#     --dry-run=client -o yaml > secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tasks
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
