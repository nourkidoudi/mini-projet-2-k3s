apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tasks
spec:
  replicas: 2
  selector:
    matchLabels: { app: tasks, tier: api }
  template:
    metadata:
      labels: { app: tasks, tier: api }
    spec:
      serviceAccountName: api-sa         # compte dédié, sans jeton monté
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                  # UID numérique (USER node est un nom)
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo 'attente de la base...'; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: api
          image: nourki2003/tasks-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: tasks
spec:
  selector: { app: tasks, tier: api }
  ports:
    - port: 3000
      targetPort: 3000