apiVersion: v1
kind: ServiceAccount
metadata: { name: api-sa, namespace: tasks }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: frontend-sa, namespace: tasks }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: db-sa, namespace: tasks }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: dev-viewer, namespace: tasks }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: viewer-role, namespace: tasks }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: dev-viewer-binding, namespace: tasks }
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: tasks
roleRef:
  kind: Role
  name: viewer-role
  apiGroup: rbac.authorization.k8s.io
